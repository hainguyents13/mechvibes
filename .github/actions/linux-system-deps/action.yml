name: Linux system dependencies
description: >
  Installs the system libraries the crate needs to build on Debian/Ubuntu.
  The single place this list lives for CI and the release build, so the two
  cannot drift. Mirrors the "Linux (Ubuntu/Debian)" list in README.md.

# libasound2-dev backs rodio/cpal, libevdev-dev backs the Linux input listener,
# and the webkit/gtk/appindicator/rsvg set backs the Dioxus desktop webview and
# tray icon. libxi-dev and libxtst-dev back rdev's X11 backend; libssl-dev backs
# the TLS stack reqwest links against. The AppImage extras from the README list
# (autoconf, automake, libtool, libfuse2) are omitted on purpose: they are for
# building appimagetool itself, and the build script downloads a prebuilt one.
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libevdev-dev \
          libxdo-dev \
          libxi-dev \
          libxtst-dev \
          libssl-dev
